name: Nightly Dependency Update

# Fully automatic, no human in the loop. Every night, against the CURRENT tip of main:
#   update   `cargo update` (compatible bumps only); continue only if Cargo.lock changed
#   verify   fmt + clippy + tests on Linux, and tests on macOS and Windows
#   msrv     the declared minimum Rust version still builds
#   release  commit the lockfile and push it to main. The version is NOT bumped and
#            nothing is tagged or released.
# No changes => nothing is committed.
#
# This host runs on its own: there is deliberately NO mirroring to Gitea. Gitea has
# its own nightly (.gitea/workflows/deps-update.yml). If the two histories ever
# diverge, force-push whichever one you want to keep.
#
# Secrets (all optional): GH_PAT — a PAT lets the push bypass branch protection.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC (Gitea runs at 02:30)
  workflow_dispatch:
    inputs:
      release:
        description: "Commit and push the lockfile when dependencies changed (no version bump)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  actions: write

# Never cancel mid-run: a half-finished push/tag would leave main inconsistent.
concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  # ── 1. Update ───────────────────────────────────────────────────────────────
  update:
    name: Update Cargo.lock
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.111.0"

      # Record what ships BEFORE updating, to compare with afterwards (see "Check for changes").
      - name: Snapshot what ships (before)
        run: |
          T="${RUNNER_TEMP:-/tmp}"
          cargo tree --workspace --all-features --edges normal,build --target all --prefix none --format '{p}' | sed 's/ (\/.*//' | sort -u > "$T/shipped-before.txt"
          wc -l < "$T/shipped-before.txt"

      - name: Run cargo update
        run: cargo update

      # Only a REAL upgrade counts, and it must ship. `cargo update` can also change the
      # lockfile for reasons that are not worth a release: crates only tests use, a
      # downgrade (a yanked release, a resolver surprise), checksum-only edits. So the
      # packages of the normal + build dependency graph (all features, all targets) are
      # compared before and after, and a release needs at least one package at a HIGHER
      # version and none at a lower one (scripts/ci/lock_changes.nu has the rules).
      - name: Check for changes
        id: check
        run: |
          T="${RUNNER_TEMP:-/tmp}"
          cargo tree --workspace --all-features --edges normal,build --target all --prefix none --format '{p}' | sed 's/ (\/.*//' | sort -u > "$T/shipped-after.txt"
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes detected."
          else
            echo "Cargo.lock changed; checking that something that ships was really upgraded:"
            nu scripts/ci/lock_changes.nu "$T/shipped-before.txt" "$T/shipped-after.txt" --output "$GITHUB_OUTPUT"
          fi

      - name: Upload updated Cargo.lock
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock
          retention-days: 1

  # ── 2. Verify on every platform ─────────────────────────────────────────────
  verify:
    name: verify (${{ matrix.os }})
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -A deprecated

      - name: Tests
        run: cargo test --locked --workspace --all-features --all-targets

  # ── 3. MSRV ─────────────────────────────────────────────────────────────────
  # A bump that needs a newer compiler than the declared `rust-version` must not be
  # released. tokenburn-web declares its own, higher MSRV (Topcoat), so it is excluded.
  msrv:
    name: msrv
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock

      - name: Read the declared MSRV
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (MSRV)
        run: cargo check --locked --workspace --exclude tokenburn-web --all-targets

  # ── 4. Commit and push the lockfile ─────────────────────────────────────
  release:
    name: Commit lockfile
    needs: [update, verify, msrv]
    if: needs.update.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.release)
    runs-on: ubuntu-latest
    steps:
      # Re-sync to the REAL tip of main: it may have moved while the checks ran.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: cargo-lock

      # Fails (safely) if main's manifests changed in the meantime and the
      # verified lockfile no longer matches them.
      - name: Verify the lockfile still matches the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Commit updated Cargo.lock
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): nightly cargo update $(date -u '+%Y-%m-%d')"

      # Lockfile only: no version bump, no tag, no release. Fail loudly on a failed push.
      - name: Push lockfile update
        run: git push origin HEAD:main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

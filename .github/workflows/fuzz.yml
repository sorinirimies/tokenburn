name: Fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths: ["fuzz/**", "crates/**/src/**", "Cargo.lock"]
  pull_request:
    paths: ["fuzz/**", "crates/**/src/**", "Cargo.lock"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Install Nushell
        run: |
          V=0.116.1
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/dl.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/dl.tgz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || { mkdir -p $HOME/.cargo/bin; install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu $HOME/.cargo/bin/nu; }
          nu --version
      - name: Fuzz each target for 60s
        run: nu scripts/ci/fuzz_all.nu --secs 60
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

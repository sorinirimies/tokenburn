name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.7.7)"
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 0. Validate tag ──────────────────────────────────────────────────────────
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag '${TAG}' does not match vX.Y.Z — aborting."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ── 1. Quality gate (Linux) ───────────────────────────────────────────────────
  test:
    name: Test & lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: cargo install nu --locked
      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

  # ── 2. Build matrix ───────────────────────────────────────────────────────────
  # GitHub provides free hosted runners for all three platforms.
  # No self-hosted machines required.
  build:
    name: Build — ${{ matrix.name }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc builds run on the OLDEST hosted runner on purpose: a
          # binary needs at least the glibc of the machine that linked it, so
          # building on 22.04 (glibc 2.35) keeps it running on Debian 12+,
          # Ubuntu 22.04+, Fedora, Arch, openSUSE, … The GUI `dlopen()`s
          # X11/Wayland/GL, so the same binary serves X11 *and* Wayland.
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
            os: linux

          - name: Linux aarch64
            runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            suffix: ""
            os: linux

          # ── Linux x86_64, fully static (musl): CLI + TUI + web only ──────────
          # Runs on ANY distro (Alpine, old CentOS, NixOS, containers…) with no
          # glibc requirement. The GUI cannot be static (it dlopen()s the
          # display server libraries), so it is skipped here.
          - name: Linux x86_64 (static musl)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            suffix: ""
            os: linux
            musl: true

          # ── Windows x86_64 (GitHub hosted Windows runner) ─────────────────────
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
            os: windows

          # ── macOS x86_64 (GitHub hosted macOS runner) ─────────────────────────
          - name: macOS x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
            os: macos

          # ── macOS aarch64 / Apple Silicon (GitHub hosted macOS runner) ─────────
          - name: macOS aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            os: macos

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install packaging tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross dpkg-dev rpm alien fakeroot \
            musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Configure aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p ~/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"'   >> ~/.cargo/config.toml

      - name: Build TUI
        run: cargo build --release -p tokenburn-tui --target ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release -p tokenburn --target ${{ matrix.target }}

      - name: Build GUI
        if: ${{ !matrix.musl }}
        run: cargo build --release -p tokenburn-gui --target ${{ matrix.target }}

      - name: Build web
        run: cargo build --release -p tokenburn-web --target ${{ matrix.target }}

      # ── Web runtime bundle (live dashboard) ────────────────────────────────
      # Built in the SAME job as the target binary: asset IDs depend on crate
      # name + source path, not on the target, so this host-built bundle
      # matches the cross-compiled binary. It ships next to the binary
      # (archives, installers, packages) — without it tokenburn-web still
      # works, in static mode.
      - name: Install Topcoat CLI
        run: cargo install topcoat-cli --locked

      - name: Bundle web runtime assets
        shell: bash
        run: bash scripts/ci/bundle_web.sh

      # ── Linux: .deb, .rpm, AppImage ────────────────────────────────────────
      - name: Install Nushell
        if: matrix.os == 'linux'
        run: cargo install nu --locked

      - name: Build .deb and .rpm
        if: matrix.os == 'linux' && !matrix.musl
        run: nu scripts/ci/package_linux.nu ${{ needs.validate.outputs.version }} ${{ matrix.target }}

      - name: Install appimagetool
        if: matrix.os == 'linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo cp /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build AppImage
        if: matrix.os == 'linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: bash scripts/ci/package_appimage.sh ${{ needs.validate.outputs.version }} ${{ matrix.target }}

      # ── Windows: NSIS installer ──────────────────────────────────────────────
      - name: Build NSIS installer
        if: matrix.os == 'windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          bash scripts/ci/package_windows.sh ${{ needs.validate.outputs.version }}

      # ── Portable archive: .tar.gz (Linux/macOS) or .zip (Windows) ───────────
      - name: Package portable archive
        shell: bash
        run: bash scripts/ci/package_archive.sh "${{ needs.validate.outputs.version }}" "${{ matrix.target }}" "${{ matrix.suffix }}"

      # ── Stage raw binaries ───────────────────────────────────────────────────
      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tokenburn${{ matrix.suffix }} \
             dist/tokenburn-cli-${{ matrix.target }}${{ matrix.suffix }} || true
          cp target/${{ matrix.target }}/release/tokenburn-gui${{ matrix.suffix }} \
             dist/tokenburn-gui-${{ matrix.target }}${{ matrix.suffix }} || true
          cp target/${{ matrix.target }}/release/tokenburn-web${{ matrix.suffix }} \
             dist/tokenburn-web-${{ matrix.target }}${{ matrix.suffix }} || true
          cp target/${{ matrix.target }}/release/tokenburn-tui${{ matrix.suffix }} \
             dist/tokenburn-tui-${{ matrix.target }}${{ matrix.suffix }} || true

      # Upload release files only (not the deb-*/AppDir-* staging directories).
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*-setup.exe
            dist/tokenburn-cli-*
            dist/tokenburn-tui-*
            dist/tokenburn-gui-*
            dist/tokenburn-web-*
          if-no-files-found: error
          retention-days: 1

      # The macOS DMG job needs the web runtime bundle too.
      - name: Upload web runtime assets
        if: matrix.os == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: web-assets-${{ matrix.target }}
          path: dist/web-assets
          if-no-files-found: error
          retention-days: 1

  # ── 3. macOS Universal DMG ────────────────────────────────────────────────────
  # Merges the arm64 + x86_64 macOS binaries into a single universal DMG.
  macos-dmg:
    name: macOS Universal DMG
    needs: [validate, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-aarch64-apple-darwin
          path: artifacts/arm64/

      - name: Download x86_64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-x86_64-apple-darwin
          path: artifacts/x86_64/

      - name: Download web runtime assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets-aarch64-apple-darwin
          path: dist/web-assets/

      - name: Reconstruct target dirs
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          mkdir -p target/x86_64-apple-darwin/release
          cp artifacts/arm64/tokenburn-web-aarch64-apple-darwin   target/aarch64-apple-darwin/release/tokenburn-web
          cp artifacts/x86_64/tokenburn-web-x86_64-apple-darwin   target/x86_64-apple-darwin/release/tokenburn-web
          cp artifacts/arm64/tokenburn-gui-aarch64-apple-darwin   target/aarch64-apple-darwin/release/tokenburn-gui
          cp artifacts/arm64/tokenburn-cli-aarch64-apple-darwin   target/aarch64-apple-darwin/release/tokenburn
          cp artifacts/arm64/tokenburn-tui-aarch64-apple-darwin   target/aarch64-apple-darwin/release/tokenburn-tui
          cp artifacts/x86_64/tokenburn-gui-x86_64-apple-darwin   target/x86_64-apple-darwin/release/tokenburn-gui
          cp artifacts/x86_64/tokenburn-cli-x86_64-apple-darwin   target/x86_64-apple-darwin/release/tokenburn
          cp artifacts/x86_64/tokenburn-tui-x86_64-apple-darwin   target/x86_64-apple-darwin/release/tokenburn-tui
          chmod +x target/*/release/tokenburn target/*/release/tokenburn-gui target/*/release/tokenburn-tui target/*/release/tokenburn-web

      - name: Create universal binaries
        run: bash scripts/ci/build_universal_macos.sh

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: bash packaging/macos/create_dmg.sh ${{ needs.validate.outputs.version }}

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos-universal
          path: dist/*.dmg
          retention-days: 1

  # ── 4. GitHub Release ─────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [validate, build, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - name: Install git-cliff
        run: cargo install git-cliff --locked
      - name: Install Nushell
        run: cargo install nu --locked
      - name: Generate release notes
        run: nu scripts/ci/release_notes.nu ${{ needs.validate.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*
            LICENSE
            README.md
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Publish to crates.io ───────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: [validate, release]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  CRATES_IO_TOKEN not set — skipping."

      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_TOKEN == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_TOKEN == 'true'

      - name: Publish tokenburn-core
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          cargo info tokenburn-core@$V 2>/dev/null | grep -q "^tokenburn-core" \
            && echo "⏭️  Already published." || {
              cp README.md crates/tokenburn-core/README.md
              cargo publish -p tokenburn-core --allow-dirty && sleep 30
            }

      - name: Publish tokenburn (CLI)
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          cargo info tokenburn@$V 2>/dev/null | grep -q "^tokenburn" \
            && echo "⏭️  Already published." || {
              cp README.md crates/tokenburn-cli/README.md
              cargo publish -p tokenburn --allow-dirty && sleep 20
            }

      - name: Publish tokenburn-gui
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          cargo info tokenburn-gui@$V 2>/dev/null | grep -q "^tokenburn-gui" \
            && echo "⏭️  Already published." || {
              cp README.md crates/tokenburn-gui/README.md
              cargo publish -p tokenburn-gui --allow-dirty && sleep 20
            }

      - name: Publish tokenburn-web
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          cargo info tokenburn-web@$V 2>/dev/null | grep -q "^tokenburn-web" \
            && echo "⏭️  Already published." || {
              cp README.md crates/tokenburn-web/README.md
              cargo publish -p tokenburn-web --allow-dirty && sleep 20
            }

      - name: Publish tokenburn-tui
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          cargo info tokenburn-tui@$V 2>/dev/null | grep -q "^tokenburn-tui" \
            && echo "⏭️  Already published." || {
              cp README.md crates/tokenburn-tui/README.md
              cargo publish -p tokenburn-tui --allow-dirty
            }

  # ── 6. Update AUR ─────────────────────────────────────────────────────────────
  update-aur:
    name: Update AUR
    needs: [validate, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Update PKGBUILD checksums
        run: bash scripts/ci/update_aur.sh ${{ needs.validate.outputs.version }}

      - name: Deploy to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        continue-on-error: true
        with:
          pkgname: tokenburn
          pkgbuild: packaging/aur/tokenburn/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ needs.validate.outputs.version }}"

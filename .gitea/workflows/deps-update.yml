name: Nightly Dependency Update

# Fully automatic, no human in the loop. Every night, against the CURRENT tip of main:
#   1. `cargo update` (compatible bumps only),
#   2. only if Cargo.lock really changed: fmt + clippy + tests + MSRV check,
#   3. commit the lockfile and push it straight to main (no PR, no manual merge).
# The version is NOT bumped and nothing is tagged or released.
#
# This host runs on its own: there is deliberately NO mirroring to GitHub. GitHub
# has its own nightly (.github/workflows/deps-update.yml). If the two histories
# ever diverge, force-push whichever one you want to keep.

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC (GitHub runs at 02:00)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # This runner sits behind a flaky network (static.rust-lang.org timed out and failed a run):
  # let rustup and cargo retry downloads instead of giving up after the default 3.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"

# Never cancel mid-run: a half-finished push/tag would leave main inconsistent.
concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  update-deps:
    name: Update Cargo dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITEA_TOKEN || github.token }}
          fetch-depth: 0

      # Scheduled runs can start from a stale commit. Always rebase the working
      # tree onto the real tip of main, otherwise `cargo update` is diffed
      # against an old Cargo.lock (false "changes", unmergeable branches).
      - name: Sync to latest main
        run: |
          git fetch --tags --force origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git log -1 --oneline

      - name: Install Rust stable
        run: |
          for i in 1 2 3 4 5; do
            curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-all-errors --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component rustfmt --component clippy && break
            [ $i = 5 ] && exit 1
            echo "rustup install failed, retrying..."; sleep 15
          done
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.111.0"

      # Record what ships BEFORE updating, to compare with afterwards (see "Check for changes").
      - name: Snapshot what ships (before)
        run: |
          T="${RUNNER_TEMP:-/tmp}"
          cargo tree --workspace --all-features --edges normal,build --target all --prefix none --format '{p}' | sed 's/ (\/.*//' | sort -u > "$T/shipped-before.txt"
          wc -l < "$T/shipped-before.txt"

      - name: Run cargo update
        run: cargo update

      # Only a REAL upgrade counts, and it must ship. `cargo update` can also change the
      # lockfile for reasons that are not worth a release: crates only tests use, a
      # downgrade (a yanked release, a resolver surprise), checksum-only edits. So the
      # packages of the normal + build dependency graph (all features, all targets) are
      # compared before and after, and a release needs at least one package at a HIGHER
      # version and none at a lower one (scripts/ci/lock_changes.nu has the rules).
      - name: Check for changes
        id: check
        run: |
          T="${RUNNER_TEMP:-/tmp}"
          cargo tree --workspace --all-features --edges normal,build --target all --prefix none --format '{p}' | sed 's/ (\/.*//' | sort -u > "$T/shipped-after.txt"
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes detected."
          else
            echo "Cargo.lock changed; checking that something that ships was really upgraded:"
            nu scripts/ci/lock_changes.nu "$T/shipped-before.txt" "$T/shipped-after.txt" --output "$GITHUB_OUTPUT"
          fi

      - name: Check formatting
        if: steps.check.outputs.changed == 'true'
        run: cargo fmt --all -- --check

      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        run: cargo test --locked --workspace --all-features --all-targets

      - name: Run clippy
        if: steps.check.outputs.changed == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -A deprecated

      # A dependency bump that needs a newer compiler than our declared
      # `rust-version` must not be released. tokenburn-web declares its own,
      # higher MSRV (Topcoat), so it is excluded from this check.
      - name: Check MSRV still builds
        if: steps.check.outputs.changed == 'true'
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --locked --workspace --exclude tokenburn-web --all-targets

      - name: Commit updated Cargo.lock
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"
          git add Cargo.lock
          git commit -m "chore(deps): nightly cargo update $(date -u '+%Y-%m-%d')"

      # Lockfile only: no version bump, no tag, no release. Fail loudly on a failed push.
      - name: Push lockfile update to Gitea
        if: steps.check.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Nothing to update
        if: steps.check.outputs.changed == 'false'
        run: echo "✅ All dependencies already up to date — no commit, no release."

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.7.7)"
        required: true
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # This runner sits behind a flaky network (static.rust-lang.org timed out and failed a run):
  # let rustup and cargo retry downloads instead of giving up after the default 3.
  RUSTUP_MAX_RETRIES: "10"
  CARGO_NET_RETRY: "10"

jobs:
  # ── 0. Validate tag ──────────────────────────────────────────────────────────
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve and validate tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag '${TAG}' does not match vX.Y.Z — aborting."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ── 1. Quality gate ───────────────────────────────────────────────────────────
  test:
    name: Test & lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-all-errors --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup component add rustfmt clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Nushell
        run: |
          V=0.116.1
          curl -fsSL https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || { mkdir -p $HOME/.cargo/bin; install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu $HOME/.cargo/bin/nu; }
          nu --version
      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

  # ── 2. Linux builds (native + aarch64 cross) ──────────────────────────────────
  build-linux:
    name: Build Linux — ${{ matrix.target }}
    needs: [validate, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-gnu
            cross: true
          # Fully static: runs on any distro. CLI + TUI + web only (the GUI
          # dlopen()s X11/Wayland/GL and cannot be static).
          - target: x86_64-unknown-linux-musl
            cross: false
            musl: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install packaging tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross dpkg-dev rpm alien fakeroot musl-tools

      - name: Install Rust stable + target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-all-errors --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup target add ${{ matrix.target }}

      - name: Configure aarch64 cross-linker
        if: matrix.cross == true
        run: |
          mkdir -p ~/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"'   >> ~/.cargo/config.toml

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build TUI
        run: cargo build --release -p tokenburn-tui --target ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release -p tokenburn --target ${{ matrix.target }}

      - name: Build GUI
        if: ${{ !matrix.musl }}
        run: cargo build --release -p tokenburn-gui --target ${{ matrix.target }}

      - name: Build web
        run: cargo build --release -p tokenburn-web --target ${{ matrix.target }}

      # Web runtime bundle for the live dashboard. Built in this job: asset IDs
      # depend on crate name + source path, not on the target, so the
      # host-built bundle matches the cross-compiled binary.
      - name: Install Topcoat CLI
        run: cargo install topcoat-cli --locked

      - name: Bundle web runtime assets
        run: bash scripts/ci/bundle_web.sh

      - name: Install Nushell
        if: ${{ !matrix.musl }}
        run: |
          V=0.116.1
          curl -fsSL https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || { mkdir -p $HOME/.cargo/bin; install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu $HOME/.cargo/bin/nu; }
          nu --version

      - name: Build .deb and .rpm
        if: ${{ !matrix.musl }}
        run: nu scripts/ci/package_linux.nu ${{ needs.validate.outputs.version }} ${{ matrix.target }}

      - name: Install appimagetool
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo cp /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build AppImage
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: bash scripts/ci/package_appimage.sh ${{ needs.validate.outputs.version }} ${{ matrix.target }}

      - name: Package portable archive
        run: bash scripts/ci/package_archive.sh "${{ needs.validate.outputs.version }}" "${{ matrix.target }}"

      - name: Stage raw binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tokenburn      dist/tokenburn-cli-${{ matrix.target }} || true
          cp target/${{ matrix.target }}/release/tokenburn-gui  dist/tokenburn-gui-${{ matrix.target }} || true
          cp target/${{ matrix.target }}/release/tokenburn-web  dist/tokenburn-web-${{ matrix.target }} || true
          cp target/${{ matrix.target }}/release/tokenburn-tui  dist/tokenburn-tui-${{ matrix.target }} || true

      # Release files only (not the deb-*/AppDir-* staging directories).
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: linux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/tokenburn-cli-*
            dist/tokenburn-tui-*
            dist/tokenburn-gui-*
            dist/tokenburn-web-*
          retention-days: 1

  # ── 3. Windows cross-compile from Linux (mingw-w64) ───────────────────────────
  # No Windows machine needed — mingw-w64 cross-compiles .exe on Linux.
  build-windows:
    name: Build Windows x86_64 (cross from Linux)
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install mingw-w64 cross-compiler
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 mingw-w64 nsis

      - name: Install Rust stable + Windows target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-all-errors --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup target add x86_64-pc-windows-gnu

      - name: Configure Windows cross-linker
        run: |
          mkdir -p ~/.cargo
          echo '[target.x86_64-pc-windows-gnu]'           >> ~/.cargo/config.toml
          echo 'linker = "x86_64-w64-mingw32-gcc"'        >> ~/.cargo/config.toml
          echo 'ar = "x86_64-w64-mingw32-ar"'             >> ~/.cargo/config.toml

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-gnu

      - name: Build TUI for Windows
        run: cargo build --release -p tokenburn-tui --target x86_64-pc-windows-gnu

      - name: Build CLI for Windows
        run: cargo build --release -p tokenburn --target x86_64-pc-windows-gnu

      - name: Build GUI for Windows
        run: cargo build --release -p tokenburn-gui --target x86_64-pc-windows-gnu

      - name: Build web for Windows
        run: cargo build --release -p tokenburn-web --target x86_64-pc-windows-gnu

      # The bundler builds the web crate for the (Linux) host; asset IDs do not
      # depend on the target, so it matches the cross-compiled .exe.
      - name: Install Topcoat CLI
        run: cargo install topcoat-cli --locked

      - name: Bundle web runtime assets
        run: bash scripts/ci/bundle_web.sh

      - name: Package portable archive (.zip)
        run: bash scripts/ci/package_archive.sh "${{ needs.validate.outputs.version }}" x86_64-pc-windows-gnu .exe

      - name: Stage raw Windows binaries
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/tokenburn.exe     dist/tokenburn-cli-x86_64-windows.exe
          cp target/x86_64-pc-windows-gnu/release/tokenburn-gui.exe dist/tokenburn-gui-x86_64-windows.exe
          cp target/x86_64-pc-windows-gnu/release/tokenburn-web.exe dist/tokenburn-web-x86_64-windows.exe
          cp target/x86_64-pc-windows-gnu/release/tokenburn-tui.exe dist/tokenburn-tui-x86_64-windows.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v3
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/tokenburn-cli-*
            dist/tokenburn-tui-*
            dist/tokenburn-gui-*
            dist/tokenburn-web-*
          retention-days: 1

  # ── 4. Create Gitea Release ───────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [validate, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-all-errors --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install git-cliff
        run: cargo install git-cliff --locked
      - name: Install Nushell
        run: |
          V=0.116.1
          curl -fsSL https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || { mkdir -p $HOME/.cargo/bin; install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu $HOME/.cargo/bin/nu; }
          nu --version
      - name: Generate release notes
        run: nu scripts/ci/release_notes.nu ${{ needs.validate.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Flatten artifact directories
        run: |
          cd artifacts
          find . -mindepth 2 -type f -exec mv {} . \; 2>/dev/null || true
          find . -empty -type d -delete 2>/dev/null || true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Gitea Release
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          GITEA_URL="${{ github.server_url }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"

          RELEASE_BODY=$(nu -c 'open RELEASE_NOTES.md --raw | to json --raw')
          RESPONSE=$(curl -s -X POST \
            "${GITEA_URL}/api/v1/repos/${REPO}/releases" \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":${RELEASE_BODY},\"draft\":false,\"prerelease\":false}")

          RELEASE_ID=$(echo "$RESPONSE" | nu --stdin -c 'from json | get id' 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            echo "❌ Failed to create release: $RESPONSE"; exit 1
          fi

          for file in artifacts/* LICENSE README.md CHANGELOG.md; do
            [ -f "$file" ] || continue
            FILENAME=$(basename "$file")
            echo "📦 Uploading ${FILENAME}..."
            curl -s -X POST \
              "${GITEA_URL}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${FILENAME}" \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" > /dev/null
          done
          echo "✅ Release ${TAG} published."

      # This Gitea is self-hosted and every release carries ~40 installers and archives,
      # so only the newest release keeps its files. Older releases stay (notes, tags);
      # their downloads live on GitHub. A failure here must not fail the release.
      - name: Keep only the latest release's files
        run: |
          nu scripts/ci/prune_releases.nu \
            --server "${{ github.server_url }}" \
            --repo "${{ github.repository }}" \
            --keep "${{ needs.validate.outputs.tag }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            || echo "⚠️  Could not prune old release files (non-fatal)."

  # ── 5. Publish to crates.io ───────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: [validate, release]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - name: Skip (no token)
        if: env.HAS_TOKEN != 'true'
        run: echo "⏭️  CRATES_IO_TOKEN not set — skipping."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust stable
        if: env.HAS_TOKEN == 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-all-errors --retry-delay 5 https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Cache Cargo
        if: env.HAS_TOKEN == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Publish tokenburn-core
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          cargo info tokenburn-core@$V 2>/dev/null | grep -q "^tokenburn-core" \
            && echo "⏭️  Already published." || {
              cp README.md crates/tokenburn-core/README.md
              cargo publish -p tokenburn-core --allow-dirty && sleep 30
            }

      - name: Publish tokenburn (CLI)
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          cargo info tokenburn@$V 2>/dev/null | grep -q "^tokenburn" \
            && echo "⏭️  Already published." || {
              cp README.md crates/tokenburn-cli/README.md
              cargo publish -p tokenburn --allow-dirty && sleep 20
            }

      - name: Publish tokenburn-gui
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          cargo info tokenburn-gui@$V 2>/dev/null | grep -q "^tokenburn-gui" \
            && echo "⏭️  Already published." || {
              cp README.md crates/tokenburn-gui/README.md
              cargo publish -p tokenburn-gui --allow-dirty && sleep 20
            }

      - name: Publish tokenburn-web
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          cargo info tokenburn-web@$V 2>/dev/null | grep -q "^tokenburn-web" \
            && echo "⏭️  Already published." || {
              cp README.md crates/tokenburn-web/README.md
              cargo publish -p tokenburn-web --allow-dirty && sleep 20
            }

      - name: Publish tokenburn-tui
        if: env.HAS_TOKEN == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          V="${{ needs.validate.outputs.version }}"
          cargo info tokenburn-tui@$V 2>/dev/null | grep -q "^tokenburn-tui" \
            && echo "⏭️  Already published." || {
              cp README.md crates/tokenburn-tui/README.md
              cargo publish -p tokenburn-tui --allow-dirty
            }

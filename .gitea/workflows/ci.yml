name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

env:
  CARGO_TERM_COLOR: always

# Cancel any in-progress run for the same workflow + branch/PR so a new
# push immediately supersedes a stale run.
# - On pull requests: groups by PR number (each PR has its own queue).
# - On direct pushes (e.g. main, develop): groups by ref so only one run
#   for that branch is live at a time.  Previously this fell back to
#   github.run_id (unique per run) which meant pushes never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ── Shared setup ───────────────────────────────────────────────────────────────
# Most jobs need the native GUI libraries that Iced links against on Linux.
# We install them once here and reference the step from each job.
# TUI jobs (ratatui/crossterm) are pure-Rust and need no extra system deps.

jobs:
  # ── 1. Formatting ────────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + rustfmt
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup component add rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (workspace)
        run: cargo fmt --all -- --check

  # ── 2. Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust stable + clippy
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup component add clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A deprecated

  # ── 3. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Generate lockfile (if absent)
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      # Run the full test suite.  GUI rendering tests are compile-only on a
      # headless runner (they never open a window), so they pass fine.
      - name: cargo test --workspace
        run: cargo test --workspace --all-features --all-targets

  # ── 3b. Static musl build (CLI / TUI / web) ──────────────────────────────────
  musl:
    name: musl (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust stable + musl target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-musl

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build static binaries
        run: cargo build --release --target x86_64-unknown-linux-musl -p tokenburn -p tokenburn-tui -p tokenburn-web

      - name: Verify they are statically linked and run
        run: |
          for b in tokenburn tokenburn-tui tokenburn-web; do
            f=target/x86_64-unknown-linux-musl/release/$b
            if ldd "$f" 2>&1 | grep -qv -e 'not a dynamic' -e 'statically linked'; then
              echo "❌ $f is dynamically linked"; ldd "$f"; exit 1
            fi
            "$f" --version
          done

  # ── 3c. Live web dashboard smoke test ────────────────────────────────────────
  web-smoke:
    name: web (live smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Topcoat CLI
        run: cargo install topcoat-cli --locked

      - name: Bundle web runtime assets
        run: bash scripts/ci/bundle_web.sh dist/web-assets

      - name: Build web (release)
        run: cargo build --release -p tokenburn-web

      # Start the real binary and check the live mode really comes up.
      - name: Smoke test the live dashboard
        run: |
          TOKENBURN_WEB_ASSETS=dist/web-assets target/release/tokenburn-web --port 3999 --no-open > web.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3999/api/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3999/api/health
          curl -sf http://127.0.0.1:3999/ | grep -q 'topcoat::shard::start' || { echo "live mode not active"; cat web.log; kill $PID; exit 1; }
          curl -sf http://127.0.0.1:3999/api/report >/dev/null
          kill $PID
          grep -q '(live)' web.log || { cat web.log; exit 1; }

  # ── 4. Build (dev) ───────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build core (dev)
        run: cargo build -p tokenburn-core

      - name: Build CLI (dev)
        run: cargo build -p tokenburn

      - name: Build GUI (dev)
        run: cargo build -p tokenburn-gui

      - name: Build web (dev)
        run: cargo build -p tokenburn-web

      - name: Build TUI (dev)
        run: cargo build -p tokenburn-tui

  # ── 5. Docs ──────────────────────────────────────────────────────────────────
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust nightly
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Build docs for the two published crates (core is an internal dep).
      - name: cargo doc (tokenburn)
        run: cargo doc --no-deps -p tokenburn --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

      - name: cargo doc (tokenburn-gui)
        run: cargo doc --no-deps -p tokenburn-gui --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

      - name: cargo doc (tokenburn-web)
        run: cargo doc --no-deps -p tokenburn-web --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

      - name: cargo doc (tokenburn-tui)
        run: cargo doc --no-deps -p tokenburn-tui --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # ── 6. Nu script tests ───────────────────────────────────────────────────────
  test-nu:
    name: test-nu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Generate lockfile (if absent)
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      - name: Install Nushell
        run: cargo install nu --locked

      - name: Run Nu script tests
        run: nu scripts/tests/run_all.nu

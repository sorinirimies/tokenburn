[workspace]
members = [
    "crates/tokenburn-core",
    "crates/tokenburn-cli",
    "crates/tokenburn-gui",
    "crates/tokenburn-tui",
    "crates/tokenburn-web",
]
resolver = "2"

[workspace.package]
version      = "0.3.6"
edition      = "2021"
rust-version = "1.90"   # MSRV across Linux/macOS/Windows graphs (ordered-float 5.5 needs 1.90). tokenburn-web needs 1.98 (Topcoat) and says so itself
authors      = ["Sorin Irimies <sorinirimies@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/sorinirimies/tokenburn"

# ── Shared dependency versions ─────────────────────────────────────────────────
# Pin versions here once; each crate's Cargo.toml references them with
# `{ workspace = true }` so there is a single source of truth.

[workspace.dependencies]
# Core / shared
anyhow       = "1"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
chrono       = { version = "0.4", features = ["serde"] }
dirs         = "6.0"
rusqlite     = { version = "0.37", features = ["bundled"] }
zstd         = "0.13"
tempfile     = "3"
notify-rust  = "4"
futures      = "0.3"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI (clap)
clap         = { version = "4", features = ["derive", "env"] }

# GUI (Iced). Default features are kept on purpose: `x11` + `wayland` (both
# dlopen'ed at runtime, so one Linux binary runs on either session type and on
# any distro) and `wgpu` + `tiny-skia` (GPU rendering with a software fallback).
iced         = { version = "0.14", features = ["advanced", "canvas"] }

# TUI (Ratatui)
ratatui      = "0.30"
crossterm    = "0.29"
tui-spinner  = "0.4"     # animated spinner (loading indicator)
tui-checkbox = "0.4"     # options checkboxes
tui-slider   = "0.3"     # options sliders
tui-piechart = "1.0"     # cost / token share pie chart
tui-nuances = "0.1.9"  # shared themes

# Web (Topcoat)
topcoat      = "0.10"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }

# Internal crates
tokenburn-core = { path = "crates/tokenburn-core", version = "0.3.6" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level     = 3
lto           = "thin"   # faster than full LTO, nearly same size reduction
codegen-units = 1        # maximises inlining across crate boundaries
strip         = "symbols" # removes debug symbols from release binary
panic         = "abort"  # removes unwinding tables (~10% smaller binary)
[package]
name = "tokenburn"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "TokenBurn — local AI token/cost usage report for pi + Zed (clap CLI)"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["ai", "tokens", "usage", "cost", "cli"]

[lib]
name = "tokenburn_cli"
path = "src/lib.rs"

[[bin]]
name = "tokenburn"
path = "src/main.rs"

[dependencies]
tokenburn-core = { workspace = true }
clap           = { workspace = true }
anyhow         = { workspace = true }
serde_json     = { workspace = true }
chrono         = { workspace = true }

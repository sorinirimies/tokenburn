[package]
name = "tokenburn-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "TokenBurn — local AI token/cost usage desktop application (Iced GUI)"
readme = "README.md"
categories = ["gui", "development-tools"]
keywords = ["ai", "tokens", "usage", "cost", "gui"]

[lib]
name = "tokenburn_gui"
path = "src/lib.rs"

[[bin]]
name = "tokenburn-gui"
path = "src/main.rs"

[dependencies]
tokenburn-core     = { workspace = true }
iced               = { workspace = true }
futures            = { workspace = true }
chrono             = { workspace = true }
clap               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# macOS: winit builds a menu bar with only the application menu, so the system's window
# commands (Minimize, Zoom, Move & Resize / tiling, and the shortcuts that go with them)
# are missing. `src/macos.rs` adds the standard Window menu. The same versions winit
# itself uses, so nothing new is compiled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.5"
objc2-app-kit    = { version = "0.2", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSObject"] }
